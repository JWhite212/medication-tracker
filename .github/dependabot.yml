# Version updates. docs/dependency-policy.md promises security-critical
# runtime patches within 14 days; this is what surfaces them. The file used
# to be GitHub's unedited template (`package-ecosystem: ""`), which
# Dependabot rejects, so nothing was ever proposed.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine minor/patch churn; majors still arrive one
      # by one so each can be read on its own.
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
