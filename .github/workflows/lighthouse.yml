name: Lighthouse

# Production drift check for Core Web Vitals and accessibility scores.
# Runs against the live site (not previews — authenticated pages there
# would need session bootstrapping), so it is scheduled rather than
# per-PR. Trigger manually from the Actions tab after a perf-sensitive
# deploy.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit production URLs
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://medication-tracker.jamiewhite.site/
            https://medication-tracker.jamiewhite.site/auth/login
          # Median of 3 runs smooths out serverless cold-start variance.
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: true
