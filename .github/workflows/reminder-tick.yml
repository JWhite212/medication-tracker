name: Reminder tick

# Drives /api/cron/reminders more often than the Vercel Hobby plan
# allows. Hobby caps cron jobs at one run per day, which is far too
# coarse for medication reminders: an evening dose would only ever be
# reported the following morning. This workflow is what makes reminders
# timely during waking hours.
#
# The vercel.json cron (09:00 UTC) stays in place as a daily backstop,
# but a narrow one. computeOverdueSlot stops reminding about a fixed-time
# slot from before the user's local midnight once it is 12 hours old
# (CARRY_OVER_MS, the instant the dashboard stops showing it). So the
# 09:00 run on its own covers today's elapsed slots and only the last 12
# hours of yesterday's. If GitHub disables this workflow (see below),
# yesterday's daytime slots lose their day-late reminder rather than
# getting it at 09:00. The cron dead-man switch (#128) is what detects
# that.
#
# Setup: add a repository secret CRON_SECRET matching the value set in
# the Vercel production environment. Without it this workflow no-ops
# rather than failing every half hour.
#
# The target origin is pinned in this file rather than read from a
# repository variable on purpose: the request carries CRON_SECRET, so
# anything that can change the destination can redirect the secret.
# Pinning it means altering the target requires a reviewed commit.
#
# Two caveats worth knowing: GitHub's scheduler is best-effort and can
# run late under load, and it disables scheduled workflows in repos with
# no activity for 60 days.
on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes, 06:00–22:59 UTC. The overnight gap lets the Neon
    # compute scale to zero instead of being held awake around the
    # clock. A slot that falls due in the gap is picked up by the 06:00
    # run, at most 7½ hours late. Keep the gap under 12 hours: a slot
    # from before the user's midnight stops reminding at 12 hours old
    # (computeOverdueSlot's cap), so a longer gap would silently skip it.
    - cron: "*/30 6-22 * * *"

permissions:
  contents: read

# Never let a slow run overlap the next tick — the dispatcher dedupes on
# a slot key, but concurrent runs would race for the same claim.
concurrency:
  group: reminder-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch due reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: https://medication-tracker.jamiewhite.site
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::notice::CRON_SECRET repository secret is not set — skipping."
            exit 0
          fi

          url="${BASE_URL}/api/cron/reminders"

          status=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
            --max-time 60 --retry 2 --retry-delay 10 --retry-connrefused \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${url}")

          echo "HTTP ${status}"
          cat /tmp/response.json || true
          echo

          if [ "${status}" != "200" ]; then
            echo "::error::Reminder dispatch failed with HTTP ${status}"
            exit 1
          fi
