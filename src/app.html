<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `black-translucent` paints light glyphs over page content, which is
         unreadable over a light surface. `default` follows the theme-color meta
         above and stays correct when 1c adds a light palette. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MedTracker" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "MedTracker",
        "url": "https://medication-tracker.jamiewhite.site",
        "description": "Personal medication tracker with dose logging, live timers, adherence analytics, and inventory management.",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Web"
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <a
      href="#main-content"
      class="focus:bg-accent focus:text-accent-fg sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-50 focus:rounded-lg focus:px-4 focus:py-2"
      >Skip to main content</a
    >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
